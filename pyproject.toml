[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hire-sense-ai"
version = "1.0.0"
description = "AI-powered resume analysis and job matching backend"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.18.5",
    "bcrypt==4.0.1",
    "fastapi==0.141.1",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "pydantic-settings==2.14.2",
    "psycopg==3.3.4",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.52.0",
    "pypdf==6.15.0",
    "python-docx==1.2.0",
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
